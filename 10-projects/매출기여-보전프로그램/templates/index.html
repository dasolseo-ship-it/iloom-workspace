<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>매출기여 보전 프로그램 | iloom</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js" defer></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          brand: '#c80a1e',
          'brand-dark': '#a00818',
        }
      }
    }
  }
</script>
<style>
  [x-cloak] { display: none !important; }
  .badge-full    { @apply bg-green-100 text-green-700 text-xs font-semibold px-2 py-0.5 rounded; }
  .badge-partial { @apply bg-yellow-100 text-yellow-700 text-xs font-semibold px-2 py-0.5 rounded; }
  .badge-rejected{ @apply bg-red-100 text-red-700 text-xs font-semibold px-2 py-0.5 rounded; }
  .badge-pending { @apply bg-gray-100 text-gray-500 text-xs font-semibold px-2 py-0.5 rounded; }
  input[type=text], input[type=date], input[type=number], select {
    @apply border border-gray-300 rounded px-3 py-1.5 text-sm w-full focus:outline-none focus:border-brand;
  }
</style>
</head>
<body class="bg-gray-50 text-gray-800" x-data="app()" x-init="init()">

<!-- Header -->
<header class="bg-white border-b border-gray-200 sticky top-0 z-50">
  <div class="max-w-6xl mx-auto px-6 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <span class="text-brand font-bold text-lg tracking-tight">iloom</span>
      <span class="text-gray-400">|</span>
      <span class="font-semibold text-gray-700 text-sm">매출기여 보전 프로그램</span>
      <span class="text-xs text-gray-400 hidden sm:inline">2026.05.01 ~ 2027.05.31</span>
    </div>
  </div>
</header>

<!-- Stats Bar -->
<div class="bg-white border-b border-gray-100">
  <div class="max-w-6xl mx-auto px-6 py-3 grid grid-cols-2 sm:grid-cols-4 gap-4">
    <div class="text-center">
      <div class="text-xl font-bold text-gray-800" x-text="stats.total ?? 0"></div>
      <div class="text-xs text-gray-500">전체 수주건</div>
    </div>
    <div class="text-center">
      <div class="text-xl font-bold text-green-600" x-text="(stats.full_cnt ?? 0) + (stats.partial_cnt ?? 0)"></div>
      <div class="text-xs text-gray-500">인정건 (전체+부분)</div>
    </div>
    <div class="text-center">
      <div class="text-xl font-bold text-red-500" x-text="stats.rejected_cnt ?? 0"></div>
      <div class="text-xs text-gray-500">불인정건</div>
    </div>
    <div class="text-center">
      <div class="text-xl font-bold text-brand" x-text="'₩' + ((stats.total_compensation ?? 0).toLocaleString('ko-KR'))"></div>
      <div class="text-xs text-gray-500">누적 보전금액</div>
    </div>
  </div>
</div>

<!-- Tabs -->
<div class="max-w-6xl mx-auto px-6 pt-5">
  <div class="flex gap-1 border-b border-gray-200 mb-5">
    <template x-for="tab in tabs" :key="tab.id">
      <button
        @click="activeTab = tab.id"
        :class="activeTab === tab.id
          ? 'border-b-2 border-brand text-brand font-semibold'
          : 'text-gray-500 hover:text-gray-700'"
        class="px-4 py-2 text-sm transition-colors"
        x-text="tab.label">
      </button>
    </template>
  </div>

  <!-- ===============================
       TAB 1: 행사 관리
  ================================ -->
  <div x-show="activeTab === 'events'" x-cloak>
    <div class="flex justify-between items-center mb-4">
      <h2 class="font-semibold text-gray-700">온라인 행사 목록 (커넥트플러스)</h2>
      <div class="flex gap-2">
        <label class="cursor-pointer bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm px-3 py-1.5 rounded flex items-center gap-1.5">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
          Excel 업로드
          <input type="file" accept=".xlsx" class="hidden" @change="uploadExcel($event)">
        </label>
        <button @click="showEventModal = true" class="bg-brand text-white text-sm px-3 py-1.5 rounded hover:bg-brand-dark flex items-center gap-1.5">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
          행사 등록
        </button>
      </div>
    </div>

    <!-- Excel 템플릿 안내 -->
    <div class="bg-blue-50 border border-blue-200 rounded p-3 mb-4 text-xs text-blue-700">
      커넥트플러스 Excel 업로드 형식: <strong>행사명 | 공지일 | 시작일 | 종료일 | 상품명 | 시리즈 | 품목</strong> (1행 헤더)
    </div>

    <!-- 행사 목록 -->
    <div class="space-y-3">
      <template x-if="events.length === 0">
        <div class="text-center py-12 text-gray-400 bg-white rounded border border-gray-200">
          등록된 행사가 없습니다. 커넥트플러스 Excel 파일을 업로드하거나 직접 등록하세요.
        </div>
      </template>
      <template x-for="event in events" :key="event.id">
        <div class="bg-white rounded border border-gray-200 p-4">
          <div class="flex justify-between items-start">
            <div>
              <div class="font-semibold text-gray-800" x-text="event.event_name"></div>
              <div class="text-xs text-gray-500 mt-0.5">
                공지: <span x-text="event.announcement_date"></span> &nbsp;|&nbsp;
                기간: <span x-text="event.start_date"></span> ~ <span x-text="event.end_date"></span>
              </div>
            </div>
            <button @click="deleteEvent(event.id)" class="text-gray-300 hover:text-red-400 transition-colors text-xs">삭제</button>
          </div>
          <div class="mt-3 flex flex-wrap gap-1.5">
            <template x-for="p in event.products" :key="p.id">
              <span class="bg-gray-100 text-gray-600 text-xs px-2 py-1 rounded">
                <span x-text="p.series" class="font-medium text-gray-700"></span>
                &nbsp;<span x-text="p.category" class="text-gray-500"></span>
                &nbsp;<span x-text="'(' + p.product_name + ')'" class="text-gray-400"></span>
              </span>
            </template>
          </div>
        </div>
      </template>
    </div>
  </div>

  <!-- ===============================
       TAB 2: 수주 입력
  ================================ -->
  <div x-show="activeTab === 'orders'" x-cloak>
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <!-- 입력 폼 -->
      <div class="bg-white rounded border border-gray-200 p-5">
        <h2 class="font-semibold text-gray-700 mb-4">취소 수주 입력</h2>
        <div class="space-y-3">
          <div>
            <label class="text-xs font-medium text-gray-600 mb-1 block">매장명</label>
            <input type="text" x-model="orderForm.store_name" placeholder="예: 롯데인천2" list="store-list">
            <datalist id="store-list">
              <option value="송도5">
              <option value="인천검단">
              <option value="인천중앙2">
              <option value="김포5">
              <option value="부천3">
              <option value="의정부8">
              <option value="신세계시흥2">
              <option value="현대목동">
              <option value="롯데구리">
              <option value="롯데인천2">
              <option value="롯데영등포">
            </datalist>
          </div>
          <div>
            <label class="text-xs font-medium text-gray-600 mb-1 block">수주 등록일 <span class="text-red-500 font-normal">(행사 공지 D-1 이전이어야 함)</span></label>
            <input type="date" x-model="orderForm.order_date">
          </div>
          <div>
            <label class="text-xs font-medium text-gray-600 mb-1 block">고객 결제액 (원)</label>
            <input type="number" x-model="orderForm.customer_amount" placeholder="예: 1500000" min="0">
          </div>
          <div>
            <label class="text-xs font-medium text-gray-600 mb-1 block">관련 온라인 행사</label>
            <select x-model="orderForm.event_id">
              <option value="">행사 선택...</option>
              <template x-for="e in events" :key="e.id">
                <option :value="e.id" x-text="e.event_name + ' (공지: ' + e.announcement_date + ')'"></option>
              </template>
            </select>
          </div>

          <!-- 수주 상품 목록 -->
          <div>
            <div class="flex justify-between items-center mb-2">
              <label class="text-xs font-medium text-gray-600">수주 상품</label>
              <button @click="addOrderProduct()" class="text-xs text-brand hover:underline">+ 상품 추가</button>
            </div>
            <div class="space-y-2">
              <template x-for="(p, i) in orderForm.products" :key="i">
                <div class="border border-gray-100 rounded p-2 space-y-1.5 bg-gray-50">
                  <input type="text" x-model="p.product_name" placeholder="상품명 (예: 쿠시노 1100폭)">
                  <div class="grid grid-cols-2 gap-1.5">
                    <select x-model="p.series">
                      <option value="">시리즈 선택</option>
                      <template x-for="s in config.series" :key="s">
                        <option :value="s" x-text="s"></option>
                      </template>
                    </select>
                    <select x-model="p.category">
                      <option value="">품목 선택</option>
                      <template x-for="c in config.categories" :key="c">
                        <option :value="c" x-text="c"></option>
                      </template>
                    </select>
                  </div>
                  <button @click="orderForm.products.splice(i,1)" class="text-xs text-gray-400 hover:text-red-500">삭제</button>
                </div>
              </template>
              <template x-if="orderForm.products.length === 0">
                <div class="text-xs text-gray-400 text-center py-3 border border-dashed border-gray-200 rounded">상품을 추가하세요</div>
              </template>
            </div>
          </div>

          <button
            @click="submitOrder()"
            :disabled="submitting"
            class="w-full bg-brand text-white rounded py-2 text-sm font-semibold hover:bg-brand-dark disabled:opacity-50 transition-colors">
            <span x-show="!submitting">매칭 실행</span>
            <span x-show="submitting">처리 중...</span>
          </button>
        </div>
      </div>

      <!-- 결과 패널 -->
      <div>
        <template x-if="lastResult">
          <div class="bg-white rounded border-2 p-5"
            :class="{
              'border-green-400': lastResult.result_type === 'full',
              'border-yellow-400': lastResult.result_type === 'partial',
              'border-red-400': lastResult.result_type === 'rejected'
            }">
            <div class="flex items-center gap-2 mb-4">
              <span class="text-lg font-bold" x-text="lastResult.message"></span>
            </div>
            <template x-if="lastResult.result_type !== 'rejected'">
              <div class="bg-gray-50 rounded p-3 mb-4">
                <div class="text-xs text-gray-500">보전금액 (결제액 × 5%)</div>
                <div class="text-2xl font-bold text-brand" x-text="'₩' + lastResult.compensation.toLocaleString('ko-KR')"></div>
              </div>
            </template>
            <div class="text-xs font-medium text-gray-600 mb-2">상품별 인정 결과</div>
            <div class="space-y-1.5">
              <template x-for="p in lastResult.products" :key="p.product_name">
                <div class="flex items-center justify-between text-sm">
                  <span x-text="p.product_name" class="text-gray-700"></span>
                  <span :class="p.match_status === 'approved' ? 'badge-full' : 'badge-rejected'"
                        x-text="p.match_status === 'approved' ? '인정' : '불인정'"></span>
                </div>
              </template>
            </div>
            <template x-if="lastResult.note">
              <div class="mt-3 text-xs text-yellow-600 bg-yellow-50 rounded p-2" x-text="lastResult.note"></div>
            </template>
          </div>
        </template>
        <template x-if="!lastResult">
          <div class="bg-white rounded border border-dashed border-gray-200 p-12 text-center text-gray-400 text-sm">
            수주 정보를 입력하고 매칭을 실행하면<br>결과가 여기 표시됩니다
          </div>
        </template>
      </div>
    </div>
  </div>

  <!-- ===============================
       TAB 3: 결과 조회
  ================================ -->
  <div x-show="activeTab === 'results'" x-cloak>
    <div class="flex justify-between items-center mb-4">
      <h2 class="font-semibold text-gray-700">수주 처리 결과</h2>
      <div class="flex gap-2 text-xs">
        <button @click="filterType=''" :class="filterType==='' ? 'text-brand font-semibold' : 'text-gray-500'" class="hover:text-brand">전체</button>
        <button @click="filterType='full'" :class="filterType==='full' ? 'text-green-600 font-semibold' : 'text-gray-500'" class="hover:text-green-600">전체인정</button>
        <button @click="filterType='partial'" :class="filterType==='partial' ? 'text-yellow-600 font-semibold' : 'text-gray-500'" class="hover:text-yellow-600">부분인정</button>
        <button @click="filterType='rejected'" :class="filterType==='rejected' ? 'text-red-500 font-semibold' : 'text-gray-500'" class="hover:text-red-500">불인정</button>
      </div>
    </div>

    <div class="bg-white rounded border border-gray-200 overflow-hidden">
      <table class="w-full text-sm">
        <thead class="bg-gray-50 text-xs text-gray-500 uppercase">
          <tr>
            <th class="px-4 py-3 text-left">매장</th>
            <th class="px-4 py-3 text-left">수주일</th>
            <th class="px-4 py-3 text-left">행사명</th>
            <th class="px-4 py-3 text-right">결제액</th>
            <th class="px-4 py-3 text-right">보전금</th>
            <th class="px-4 py-3 text-center">결과</th>
            <th class="px-4 py-3"></th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-100">
          <template x-for="o in filteredOrders" :key="o.id">
            <tr class="hover:bg-gray-50">
              <td class="px-4 py-3 font-medium" x-text="o.store_name"></td>
              <td class="px-4 py-3 text-gray-500" x-text="o.order_date"></td>
              <td class="px-4 py-3 text-gray-600 text-xs" x-text="o.event_name || '-'"></td>
              <td class="px-4 py-3 text-right" x-text="'₩' + o.customer_amount.toLocaleString('ko-KR')"></td>
              <td class="px-4 py-3 text-right font-medium text-brand"
                  x-text="o.compensation > 0 ? '₩' + o.compensation.toLocaleString('ko-KR') : '-'"></td>
              <td class="px-4 py-3 text-center">
                <span :class="{
                  'badge-full': o.result_type === 'full',
                  'badge-partial': o.result_type === 'partial',
                  'badge-rejected': o.result_type === 'rejected',
                  'badge-pending': !o.result_type
                }" x-text="{full:'전체인정', partial:'부분인정', rejected:'불인정'}[o.result_type] || '-'"></span>
              </td>
              <td class="px-4 py-3">
                <button @click="deleteOrder(o.id)" class="text-gray-300 hover:text-red-400 text-xs">삭제</button>
              </td>
            </tr>
            <!-- 상품 상세 -->
            <tr class="bg-gray-50">
              <td colspan="7" class="px-4 pb-3">
                <div class="flex flex-wrap gap-1.5 mt-1">
                  <template x-for="p in o.products" :key="p.id">
                    <span class="text-xs px-2 py-0.5 rounded border"
                      :class="p.match_status === 'approved'
                        ? 'bg-green-50 border-green-200 text-green-700'
                        : 'bg-red-50 border-red-200 text-red-600'"
                      x-text="p.product_name + ' (' + (p.match_status==='approved' ? '인정' : '불인정') + ')'">
                    </span>
                  </template>
                </div>
                <template x-if="o.note">
                  <div class="mt-1 text-xs text-yellow-600" x-text="'⚠ ' + o.note"></div>
                </template>
              </td>
            </tr>
          </template>
          <template x-if="filteredOrders.length === 0">
            <tr>
              <td colspan="7" class="text-center py-10 text-gray-400">데이터가 없습니다</td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- ===============================
     행사 등록 Modal
================================ -->
<div x-show="showEventModal" x-cloak class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4">
  <div class="bg-white rounded-lg shadow-xl w-full max-w-lg max-h-[90vh] overflow-y-auto p-6" @click.outside="showEventModal = false">
    <h3 class="font-semibold text-gray-800 mb-4">행사 등록</h3>
    <div class="space-y-3">
      <div>
        <label class="text-xs font-medium text-gray-600 mb-1 block">행사명</label>
        <input type="text" x-model="eventForm.event_name" placeholder="예: 2026 여름 기획전">
      </div>
      <div class="grid grid-cols-3 gap-2">
        <div>
          <label class="text-xs font-medium text-gray-600 mb-1 block">공지일</label>
          <input type="date" x-model="eventForm.announcement_date">
        </div>
        <div>
          <label class="text-xs font-medium text-gray-600 mb-1 block">시작일</label>
          <input type="date" x-model="eventForm.start_date">
        </div>
        <div>
          <label class="text-xs font-medium text-gray-600 mb-1 block">종료일</label>
          <input type="date" x-model="eventForm.end_date">
        </div>
      </div>
      <div>
        <div class="flex justify-between items-center mb-2">
          <label class="text-xs font-medium text-gray-600">행사 상품</label>
          <button @click="addEventProduct()" class="text-xs text-brand hover:underline">+ 상품 추가</button>
        </div>
        <div class="space-y-2">
          <template x-for="(p, i) in eventForm.products" :key="i">
            <div class="border border-gray-100 rounded p-2 space-y-1.5 bg-gray-50">
              <input type="text" x-model="p.product_name" placeholder="상품명">
              <div class="grid grid-cols-2 gap-1.5">
                <select x-model="p.series">
                  <option value="">시리즈</option>
                  <template x-for="s in config.series" :key="s">
                    <option :value="s" x-text="s"></option>
                  </template>
                </select>
                <select x-model="p.category">
                  <option value="">품목</option>
                  <template x-for="c in config.categories" :key="c">
                    <option :value="c" x-text="c"></option>
                  </template>
                </select>
              </div>
              <button @click="eventForm.products.splice(i,1)" class="text-xs text-gray-400 hover:text-red-500">삭제</button>
            </div>
          </template>
        </div>
      </div>
    </div>
    <div class="flex gap-2 mt-5">
      <button @click="showEventModal = false" class="flex-1 border border-gray-300 text-gray-600 rounded py-2 text-sm hover:bg-gray-50">취소</button>
      <button @click="submitEvent()" class="flex-1 bg-brand text-white rounded py-2 text-sm font-semibold hover:bg-brand-dark">등록</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div
  x-show="toast.show" x-cloak x-transition
  class="fixed bottom-6 left-1/2 -translate-x-1/2 px-5 py-3 rounded-lg shadow-lg text-sm font-medium z-50"
  :class="toast.type === 'error' ? 'bg-red-600 text-white' : 'bg-gray-900 text-white'"
  x-text="toast.message">
</div>

<script>
function app() {
  return {
    activeTab: 'events',
    tabs: [
      { id: 'events', label: '행사 관리' },
      { id: 'orders', label: '수주 입력' },
      { id: 'results', label: '결과 조회' },
    ],
    config: { series: [], categories: [] },
    events: [],
    orders: [],
    stats: {},
    filterType: '',
    showEventModal: false,
    submitting: false,
    lastResult: null,
    toast: { show: false, message: '', type: 'success' },

    eventForm: {
      event_name: '', announcement_date: '', start_date: '', end_date: '',
      products: [],
    },
    orderForm: {
      store_name: '', order_date: '', customer_amount: '',
      event_id: '', products: [],
    },

    async init() {
      await Promise.all([this.loadConfig(), this.loadEvents(), this.loadOrders(), this.loadStats()]);
    },

    async loadConfig() {
      const r = await fetch('/api/config');
      this.config = await r.json();
    },
    async loadEvents() {
      const r = await fetch('/api/events');
      this.events = await r.json();
    },
    async loadOrders() {
      const r = await fetch('/api/orders');
      this.orders = await r.json();
    },
    async loadStats() {
      const r = await fetch('/api/stats');
      this.stats = await r.json();
    },

    get filteredOrders() {
      if (!this.filterType) return this.orders;
      return this.orders.filter(o => o.result_type === this.filterType);
    },

    addEventProduct() {
      this.eventForm.products.push({ product_name: '', series: '', category: '' });
    },
    addOrderProduct() {
      this.orderForm.products.push({ product_name: '', series: '', category: '' });
    },

    async submitEvent() {
      if (!this.eventForm.event_name || !this.eventForm.announcement_date) {
        return this.showToast('행사명과 공지일을 입력하세요', 'error');
      }
      if (this.eventForm.products.length === 0) {
        return this.showToast('상품을 1개 이상 추가하세요', 'error');
      }
      const r = await fetch('/api/events', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(this.eventForm),
      });
      if (r.ok) {
        this.showToast('행사 등록 완료');
        this.showEventModal = false;
        this.eventForm = { event_name: '', announcement_date: '', start_date: '', end_date: '', products: [] };
        await this.loadEvents();
      } else {
        const e = await r.json();
        this.showToast(e.detail || '등록 실패', 'error');
      }
    },

    async deleteEvent(id) {
      if (!confirm('행사를 삭제하시겠습니까?')) return;
      await fetch(`/api/events/${id}`, { method: 'DELETE' });
      await this.loadEvents();
      this.showToast('삭제 완료');
    },

    async submitOrder() {
      if (!this.orderForm.store_name || !this.orderForm.order_date || !this.orderForm.customer_amount || !this.orderForm.event_id) {
        return this.showToast('필수 항목을 모두 입력하세요', 'error');
      }
      if (this.orderForm.products.length === 0) {
        return this.showToast('수주 상품을 추가하세요', 'error');
      }
      this.submitting = true;
      this.lastResult = null;
      try {
        const r = await fetch('/api/orders', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            ...this.orderForm,
            customer_amount: Number(this.orderForm.customer_amount),
            event_id: Number(this.orderForm.event_id),
          }),
        });
        const data = await r.json();
        if (r.ok) {
          this.lastResult = data;
          await Promise.all([this.loadOrders(), this.loadStats()]);
          this.showToast(data.message);
        } else {
          this.showToast(data.detail || '처리 실패', 'error');
        }
      } finally {
        this.submitting = false;
      }
    },

    async deleteOrder(id) {
      if (!confirm('수주 건을 삭제하시겠습니까?')) return;
      await fetch(`/api/orders/${id}`, { method: 'DELETE' });
      await Promise.all([this.loadOrders(), this.loadStats()]);
      this.showToast('삭제 완료');
    },

    async uploadExcel(event) {
      const file = event.target.files[0];
      if (!file) return;
      const fd = new FormData();
      fd.append('file', file);
      const r = await fetch('/api/events/upload', { method: 'POST', body: fd });
      const data = await r.json();
      if (r.ok) {
        this.showToast(data.message);
        await this.loadEvents();
      } else {
        this.showToast(data.detail || '업로드 실패', 'error');
      }
      event.target.value = '';
    },

    showToast(message, type = 'success') {
      this.toast = { show: true, message, type };
      setTimeout(() => { this.toast.show = false; }, 3000);
    },
  };
}
</script>
</body>
</html>
