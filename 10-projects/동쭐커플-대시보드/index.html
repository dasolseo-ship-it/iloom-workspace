<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>동쭐커플 💛💙</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans KR', -apple-system, sans-serif;
      background: linear-gradient(135deg, #FFF0F5 0%, #F0F8FF 100%);
      min-height: 100vh;
      color: #333;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }

    /* ===== SYNC STATUS ===== */
    .sync-badge {
      position: fixed;
      top: 14px;
      right: 16px;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 20px;
      z-index: 50;
      transition: all 0.3s;
      background: #f0f0f0;
      color: #aaa;
    }
    .sync-badge.connected { background: #E8F5E9; color: #2E7D32; }
    .sync-badge.loading   { background: #FFF8E1; color: #E65100; }
    .sync-badge.error     { background: #FFEBEE; color: #C62828; }

    /* ===== HEADER ===== */
    .header {
      text-align: center;
      padding: 44px 0 30px;
    }
    .header-title {
      font-size: 2.2rem;
      font-weight: 700;
      color: #FF6B8A;
      margin-bottom: 6px;
    }
    .header-subtitle {
      font-size: 0.88rem;
      color: #bbb;
      letter-spacing: 0.05em;
    }

    /* ===== D-DAY ===== */
    .dday-card {
      background: white;
      border-radius: 24px;
      padding: 44px 40px;
      text-align: center;
      box-shadow: 0 4px 24px rgba(255,107,138,0.12);
      margin-bottom: 24px;
    }
    .dday-label {
      font-size: 1rem;
      color: #ccc;
      margin-bottom: 10px;
    }
    .dday-row {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 6px;
    }
    .dday-number {
      font-size: 5.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, #FF6B8A, #FF9F7A);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
    }
    .dday-unit {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #FF6B8A, #FF9F7A);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .dday-since {
      font-size: 0.84rem;
      color: #ccc;
      margin-top: 10px;
    }

    /* ===== ANNIVERSARIES ===== */
    .section-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #777;
      margin-bottom: 14px;
    }
    .anniversaries-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }
    .anniversary-card {
      background: white;
      border-radius: 18px;
      padding: 18px 14px;
      text-align: center;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      transition: transform 0.2s;
    }
    .anniversary-card:hover { transform: translateY(-2px); }
    .anniversary-card.next {
      border: 2px solid #FF6B8A;
      box-shadow: 0 4px 18px rgba(255,107,138,0.18);
    }
    .next-badge {
      display: inline-block;
      background: #FF6B8A;
      color: white;
      font-size: 0.64rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 20px;
      margin-bottom: 8px;
      letter-spacing: 0.06em;
    }
    .anniversary-days-left {
      font-size: 0.78rem;
      color: #FF6B8A;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .anniversary-label {
      font-size: 0.95rem;
      font-weight: 700;
      color: #333;
      margin-bottom: 4px;
    }
    .anniversary-date {
      font-size: 0.74rem;
      color: #ccc;
    }

    /* ===== CALENDAR ===== */
    .calendar-card {
      background: white;
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      margin-bottom: 24px;
    }
    .calendar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .calendar-nav-btn {
      background: none;
      border: none;
      font-size: 1.4rem;
      cursor: pointer;
      padding: 4px 12px;
      border-radius: 8px;
      color: #bbb;
      transition: all 0.2s;
      line-height: 1;
    }
    .calendar-nav-btn:hover { background: #f5f5f5; color: #FF6B8A; }
    .calendar-month-year {
      font-size: 1.15rem;
      font-weight: 700;
      color: #333;
    }
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 2px;
      overflow: hidden;
    }
    .calendar-dow {
      text-align: center;
      font-size: 0.78rem;
      font-weight: 600;
      color: #ccc;
      padding: 8px 0 10px;
    }
    .calendar-dow:first-child { color: #FF6B8A; }
    .calendar-dow:last-child  { color: #6BCFF6; }
    .calendar-day {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 4px 2px 6px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s;
      min-height: 64px;
      min-width: 0;
      overflow: hidden;
    }
    .calendar-day:hover { background: #fafafa; }
    .calendar-day.today .day-num {
      background: #FF6B8A;
      color: white !important;
      border-radius: 50%;
    }
    .calendar-day.other-month { opacity: 0.25; pointer-events: none; }
    .day-num {
      font-size: 0.86rem;
      font-weight: 500;
      margin-bottom: 4px;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .day-sunday .day-num  { color: #FF8FA0; }
    .day-saturday .day-num { color: #5CB8DC; }
    .day-events {
      display: flex;
      flex-direction: column;
      gap: 2px;
      width: 100%;
      min-width: 0;
      overflow: hidden;
    }
    .day-event-dot {
      font-size: 0.62rem;
      padding: 1px 5px;
      border-radius: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      line-height: 1.5;
    }
    .day-event-dot.dasol       { background: #FFF3CD; color: #8A6800; }
    .day-event-dot.donggeun    { background: #D0F0FF; color: #0066AA; }
    .day-event-dot.couple      { background: #FFD6E0; color: #C2185B; }
    .day-event-dot.anniversary { background: #EDE0FF; color: #6A1B9A; }

    /* ===== LEGEND ===== */
    .legend {
      display: flex;
      gap: 20px;
      margin-top: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.82rem;
      color: #888;
    }
    .legend-dot { width: 12px; height: 12px; border-radius: 3px; }
    .legend-dot.dasol       { background: #FFD93D; }
    .legend-dot.donggeun    { background: #6BCFF6; }
    .legend-dot.couple      { background: #FF6B8A; }
    .legend-dot.anniversary { background: #CE93D8; }

    /* ===== MODAL ===== */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: white;
      border-radius: 22px;
      padding: 28px;
      width: 90%;
      max-width: 380px;
      box-shadow: 0 12px 48px rgba(0,0,0,0.18);
    }
    .modal-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #333;
      margin-bottom: 18px;
    }
    .form-group { margin-bottom: 16px; }
    .form-label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: #999;
      margin-bottom: 7px;
    }
    .form-input {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #ebebeb;
      border-radius: 10px;
      font-size: 0.92rem;
      font-family: inherit;
      color: #333;
      transition: border-color 0.2s;
    }
    .form-input:focus { outline: none; border-color: #FF6B8A; }
    .person-select { display: flex; gap: 10px; }
    .person-btn {
      flex: 1;
      padding: 10px;
      border: 2px solid #ebebeb;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 600;
      background: white;
      font-family: inherit;
      transition: all 0.2s;
      color: #bbb;
    }
    .person-btn.dasol-btn.active    { border-color: #FFD93D; background: #FFFBEC; color: #8A6800; }
    .person-btn.donggeun-btn.active { border-color: #6BCFF6; background: #EFF9FF; color: #0066AA; }
    .person-btn.couple-btn.active   { border-color: #FF6B8A; background: #FFF0F4; color: #C2185B; }
    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 12px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: opacity 0.2s;
    }
    .btn-cancel { background: #f3f3f3; color: #999; }
    .btn-cancel:hover { background: #eee; }
    .btn-save {
      background: linear-gradient(135deg, #FF6B8A, #FF9F7A);
      color: white;
    }
    .btn-save:hover { opacity: 0.88; }
    .btn-save:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ===== EVENT LIST ===== */
    .event-list {
      max-height: 240px;
      overflow-y: auto;
      margin-bottom: 12px;
    }
    .event-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-radius: 10px;
      margin-bottom: 6px;
    }
    .event-item.dasol       { background: #FFF3CD; }
    .event-item.donggeun    { background: #D0F0FF; }
    .event-item.couple      { background: #FFD6E0; }
    .event-item.anniversary { background: #EDE0FF; }
    .event-item-title { font-size: 0.9rem; font-weight: 600; }
    .event-item-time  { font-size: 0.75rem; color: #888; margin-top: 2px; }
    .event-delete-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.82rem;
      color: #ccc;
      padding: 4px 7px;
      border-radius: 6px;
      transition: all 0.15s;
    }
    .event-delete-btn:hover { background: rgba(0,0,0,0.05); color: #FF6B8A; }
    .add-event-btn {
      width: 100%;
      padding: 10px;
      background: #fafafa;
      border: 1.5px dashed #e0e0e0;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.88rem;
      color: #bbb;
      font-family: inherit;
      transition: all 0.2s;
    }
    .add-event-btn:hover {
      border-color: #FF6B8A;
      color: #FF6B8A;
      background: #FFF5F7;
    }
    .empty-events {
      text-align: center;
      color: #ccc;
      padding: 18px;
      font-size: 0.86rem;
    }

    /* ===== SETUP BANNER ===== */
    .setup-banner {
      display: none;
      background: #FFF8E1;
      border: 1.5px solid #FFD54F;
      border-radius: 16px;
      padding: 18px 20px;
      margin-bottom: 20px;
      font-size: 0.88rem;
      color: #5D4037;
      line-height: 1.7;
    }
    .setup-banner.show { display: block; }
    .setup-banner strong { color: #E65100; }

    @media (max-width: 600px) {
      .header-title  { font-size: 1.7rem; }
      .dday-number   { font-size: 4rem; }
      .dday-unit     { font-size: 1.6rem; }
      .anniversaries-grid { grid-template-columns: repeat(2, 1fr); }
      .calendar-day  { min-height: 52px; }
      .day-event-dot { font-size: 0.58rem; }
      .calendar-card { padding: 18px 12px; }
    }
  </style>
</head>
<body>

  <!-- 실시간 동기화 상태 -->
  <div class="sync-badge loading" id="syncBadge">연결 중…</div>

  <div class="container">

    <!-- Firebase 미설정 안내 배너 -->
    <div class="setup-banner" id="setupBanner">
      ⚠️ Firebase 설정이 필요해요!<br>
      <strong>README.md</strong>를 참고해서 firebaseConfig를 채워주세요.<br>
      설정 완료 후 다시 열면 실시간 공유가 활성화됩니다.
    </div>

    <!-- Header -->
    <div class="header">
      <div class="header-title">💛 동쭐커플 💙</div>
      <div class="header-subtitle">다솔이랑 동근이의 러브러브 시크릿공간!💗</div>
    </div>

    <!-- D-Day -->
    <div class="dday-card">
      <div class="dday-label">우리가 함께한 지</div>
      <div class="dday-row">
        <span class="dday-number" id="ddayNumber">-</span>
        <span class="dday-unit">일</span>
      </div>
      <div class="dday-since">2026년 3월 22일부터 ♥</div>
    </div>

    <!-- 다가오는 기념일 -->
    <div class="section-title">다가오는 기념일 🗓️</div>
    <div class="anniversaries-grid" id="anniversariesGrid"></div>

    <!-- Calendar -->
    <div class="calendar-card">
      <div class="calendar-header">
        <button class="calendar-nav-btn" id="prevMonthBtn">‹</button>
        <div class="calendar-month-year" id="calendarMonthYear"></div>
        <button class="calendar-nav-btn" id="nextMonthBtn">›</button>
      </div>
      <div class="calendar-grid" id="calendarGrid"></div>
      <div class="legend">
        <div class="legend-item"><div class="legend-dot dasol"></div><span>다솔</span></div>
        <div class="legend-item"><div class="legend-dot donggeun"></div><span>동근</span></div>
        <div class="legend-item"><div class="legend-dot couple"></div><span>동쭐커플</span></div>
        <div class="legend-item"><div class="legend-dot anniversary"></div><span>기념일</span></div>
      </div>
    </div>
  </div>

  <!-- Day Modal -->
  <div class="modal-overlay" id="dayModal">
    <div class="modal">
      <div class="modal-title" id="dayModalTitle"></div>
      <div class="event-list" id="eventList"></div>
      <button class="add-event-btn" id="addEventBtn">+ 일정 추가</button>
      <div class="modal-actions">
        <button class="btn btn-cancel" id="closeDayBtn">닫기</button>
      </div>
    </div>
  </div>

  <!-- Add Event Modal -->
  <div class="modal-overlay" id="addModal">
    <div class="modal">
      <div class="modal-title">일정 추가 ✏️</div>
      <div class="form-group">
        <label class="form-label">누구의 일정?</label>
        <div class="person-select">
          <button class="person-btn dasol-btn active" id="dasolBtn">💛 다솔</button>
          <button class="person-btn donggeun-btn" id="donggeunBtn">💙 동근</button>
          <button class="person-btn couple-btn" id="coupleBtn">💗 동쭐커플</button>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">일정 제목</label>
        <input type="text" class="form-input" id="eventTitle" placeholder="어떤 일정인가요?">
      </div>
      <div class="form-group">
        <label class="form-label">시간 (선택)</label>
        <input type="time" class="form-input" id="eventTime">
      </div>
      <div class="modal-actions">
        <button class="btn btn-cancel" id="cancelAddBtn">취소</button>
        <button class="btn btn-save" id="saveEventBtn">저장</button>
      </div>
    </div>
  </div>

  <!-- =============================================
       Firebase SDK (CDN)
       ============================================= -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import {
      getFirestore,
      collection,
      onSnapshot,
      addDoc,
      deleteDoc,
      doc
    } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

    // =============================================
    // 🔧 여기에 Firebase 설정값을 붙여 넣으세요
    //    (README.md 2단계 참고)
    // =============================================
    const firebaseConfig = {
      apiKey:            "AIzaSyBN8C9Cw0zqfiPojdOqcKPgOdROzu3R7A8",
      authDomain:        "dongzzul-couple.firebaseapp.com",
      projectId:         "dongzzul-couple",
      storageBucket:     "dongzzul-couple.firebasestorage.app",
      messagingSenderId: "1065494033356",
      appId:             "1:1065494033356:web:13e4abbc53bb7348dc6369"
    };
    // =============================================

    // ===== CONFIG =====
    const START_DATE = new Date('2026-03-22T00:00:00');

    // ===== STATE =====
    let currentYear   = new Date().getFullYear();
    let currentMonth  = new Date().getMonth();
    let selectedDate  = null;
    let selectedPerson = 'dasol';
    let allEvents     = [];

    // ===== FIREBASE INIT =====
    const isConfigured = firebaseConfig.apiKey !== 'YOUR_API_KEY';
    const syncBadge    = document.getElementById('syncBadge');
    const setupBanner  = document.getElementById('setupBanner');

    let db, eventsCol;

    if (!isConfigured) {
      setupBanner.classList.add('show');
      syncBadge.textContent = '⚙️ 설정 필요';
    } else {
      const app = initializeApp(firebaseConfig);
      db        = getFirestore(app);
      eventsCol = collection(db, 'events');

      onSnapshot(
        eventsCol,
        (snapshot) => {
          allEvents = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
          syncBadge.className   = 'sync-badge connected';
          syncBadge.textContent = '🟢 실시간 연결됨';
          renderCalendar();
          if (selectedDate) renderEventList();
        },
        (err) => {
          console.error(err);
          syncBadge.className   = 'sync-badge error';
          syncBadge.textContent = '🔴 연결 오류';
        }
      );
    }

    // ===== D-DAY =====
    function updateDday() {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const start = new Date(START_DATE);
      start.setHours(0, 0, 0, 0);
      const diff = Math.floor((today - start) / (1000 * 60 * 60 * 24)) + 1;
      document.getElementById('ddayNumber').textContent = diff.toLocaleString();
    }

    // ===== ANNIVERSARIES =====
    function getAnniversaries() {
      const start = new Date('2026-03-22T00:00:00');
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const yr = today.getFullYear();
      const list = [];

      [100, 200, 300, 365, 500, 700, 730, 1000].forEach(days => {
        const d = new Date(start);
        d.setDate(d.getDate() + days - 1);
        if (d >= today) {
          list.push({
            date:  d,
            label: days === 365 ? '1주년 🥂' : days === 730 ? '2주년 🥂' : `D+${days}`,
            type:  'anniversary'
          });
        }
      });

      for (let y = yr; y <= yr + 1; y++) {
        const dg = new Date(y, 6, 15);
        const ds = new Date(y, 7, 31);
        if (dg >= today) list.push({ date: dg, label: '동근 생일 🎂', type: 'birthday' });
        if (ds >= today) list.push({ date: ds, label: '다솔 생일 🎂', type: 'birthday' });
      }

      return list.sort((a, b) => a.date - b.date).slice(0, 6);
    }

    function renderAnniversaries() {
      const list  = getAnniversaries();
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      document.getElementById('anniversariesGrid').innerHTML = list.map((item, idx) => {
        const diff    = Math.round((item.date - today) / (1000 * 60 * 60 * 24));
        const mm      = String(item.date.getMonth() + 1).padStart(2, '0');
        const dd      = String(item.date.getDate()).padStart(2, '0');
        const dateStr = `${item.date.getFullYear()}.${mm}.${dd}`;
        return `
          <div class="anniversary-card ${idx === 0 ? 'next' : ''}">
            ${idx === 0 ? '<div class="next-badge">NEXT</div>' : ''}
            <div class="anniversary-days-left">D-${diff}</div>
            <div class="anniversary-label">${item.label}</div>
            <div class="anniversary-date">${dateStr}</div>
          </div>
        `;
      }).join('');
    }

    // ===== ANNIVERSARY DATE SET =====
    function buildAnnivSet() {
      const start = new Date('2026-03-22T00:00:00');
      const set   = new Set();
      [100, 200, 300, 365, 500, 700, 730, 1000].forEach(days => {
        const d = new Date(start);
        d.setDate(d.getDate() + days - 1);
        set.add(fmt(d));
      });
      for (let y = 2026; y <= 2030; y++) {
        set.add(`${y}-07-15`);
        set.add(`${y}-08-31`);
      }
      return set;
    }

    function fmt(d) {
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    // ===== CALENDAR =====
    const MONTHS = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];

    function renderCalendar() {
      const today    = new Date();
      const firstDay = new Date(currentYear, currentMonth, 1);
      const lastDay  = new Date(currentYear, currentMonth + 1, 0);
      const annivSet = buildAnnivSet();

      document.getElementById('calendarMonthYear').textContent =
        `${currentYear}년 ${MONTHS[currentMonth]}`;

      const dows = ['일','월','화','수','목','금','토'];
      let html = dows.map(d => `<div class="calendar-dow">${d}</div>`).join('');

      const startDow = firstDay.getDay();
      for (let i = 0; i < startDow; i++) {
        const pd = new Date(currentYear, currentMonth, 1 - (startDow - i));
        html += `<div class="calendar-day other-month"><div class="day-num">${pd.getDate()}</div></div>`;
      }

      for (let d = 1; d <= lastDay.getDate(); d++) {
        const dateStr  = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const isToday  = today.getFullYear() === currentYear && today.getMonth() === currentMonth && today.getDate() === d;
        const dow      = new Date(currentYear, currentMonth, d).getDay();
        const dowClass = dow === 0 ? 'day-sunday' : dow === 6 ? 'day-saturday' : '';
        const dayEvs   = allEvents.filter(e => e.date === dateStr);
        const isAnniv  = annivSet.has(dateStr);

        let evHtml = '';
        if (isAnniv) evHtml += `<div class="day-event-dot anniversary">🎉</div>`;
        dayEvs.slice(0, 2).forEach(e => {
          evHtml += `<div class="day-event-dot ${e.person}">${e.title}</div>`;
        });
        if (dayEvs.length > 2) {
          evHtml += `<div class="day-event-dot" style="color:#bbb;font-size:0.6rem">+${dayEvs.length-2}</div>`;
        }

        html += `
          <div class="calendar-day ${isToday ? 'today' : ''} ${dowClass}" data-date="${dateStr}">
            <div class="day-num">${d}</div>
            <div class="day-events">${evHtml}</div>
          </div>
        `;
      }

      const endDow = lastDay.getDay();
      if (endDow < 6) {
        for (let i = 1; i <= 6 - endDow; i++) {
          html += `<div class="calendar-day other-month"><div class="day-num">${i}</div></div>`;
        }
      }

      document.getElementById('calendarGrid').innerHTML = html;

      // 날짜 클릭 이벤트 (이벤트 위임)
      document.getElementById('calendarGrid').querySelectorAll('.calendar-day:not(.other-month)').forEach(el => {
        el.addEventListener('click', () => openDayModal(el.dataset.date));
      });
    }

    // ===== DAY MODAL =====
    function openDayModal(dateStr) {
      selectedDate = dateStr;
      const [y, m, d] = dateStr.split('-');
      document.getElementById('dayModalTitle').textContent =
        `${y}년 ${parseInt(m)}월 ${parseInt(d)}일`;
      renderEventList();
      document.getElementById('dayModal').classList.add('active');
    }

    function closeDayModal() {
      document.getElementById('dayModal').classList.remove('active');
      selectedDate = null;
    }

    function renderEventList() {
      const events   = allEvents.filter(e => e.date === selectedDate);
      const annivSet = buildAnnivSet();
      const list     = document.getElementById('eventList');
      let html = '';

      if (annivSet.has(selectedDate)) {
        const [y, m, d] = selectedDate.split('-').map(Number);
        let label = '';
        if (m === 7 && d === 15) label = '동근 생일 🎂';
        else if (m === 8 && d === 31) label = '다솔 생일 🎂';
        else {
          const start  = new Date('2026-03-22T00:00:00');
          const target = new Date(selectedDate + 'T00:00:00');
          const dayN   = Math.round((target - start) / (1000*60*60*24)) + 1;
          label = dayN === 365 ? '1주년 🥂' : dayN === 730 ? '2주년 🥂' : `D+${dayN} 🎉`;
        }
        html += `<div class="event-item anniversary"><div><div class="event-item-title">${label}</div></div></div>`;
      }

      events.forEach(e => {
        html += `
          <div class="event-item ${e.person}">
            <div>
              <div class="event-item-title">${e.person === 'dasol' ? '💛' : e.person === 'donggeun' ? '💙' : '💗'} ${e.title}</div>
              ${e.time ? `<div class="event-item-time">${e.time}</div>` : ''}
            </div>
            <button class="event-delete-btn" data-id="${e.id}">✕</button>
          </div>
        `;
      });

      list.innerHTML = html || '<div class="empty-events">일정이 없어요 🌸</div>';

      // 삭제 버튼 이벤트
      list.querySelectorAll('.event-delete-btn').forEach(btn => {
        btn.addEventListener('click', () => deleteEvent(btn.dataset.id));
      });
    }

    // ===== ADD EVENT =====
    function openAddForm() {
      document.getElementById('eventTitle').value = '';
      document.getElementById('eventTime').value  = '';
      setSelectedPerson('dasol');
      document.getElementById('addModal').classList.add('active');
      setTimeout(() => document.getElementById('eventTitle').focus(), 100);
    }

    function closeAddModal() {
      document.getElementById('addModal').classList.remove('active');
    }

    function setSelectedPerson(person) {
      selectedPerson = person;
      document.getElementById('dasolBtn').classList.toggle('active',    person === 'dasol');
      document.getElementById('donggeunBtn').classList.toggle('active', person === 'donggeun');
      document.getElementById('coupleBtn').classList.toggle('active',   person === 'couple');
    }

    async function saveEvent() {
      const title   = document.getElementById('eventTitle').value.trim();
      if (!title) { document.getElementById('eventTitle').focus(); return; }

      const saveBtn = document.getElementById('saveEventBtn');
      saveBtn.disabled = true;
      saveBtn.textContent = '저장 중…';

      try {
        if (isConfigured) {
          await addDoc(eventsCol, {
            date:      selectedDate,
            title,
            person:    selectedPerson,
            time:      document.getElementById('eventTime').value || null,
            createdAt: new Date().toISOString()
          });
        } else {
          // Firebase 미설정 시 임시 로컬 저장
          allEvents.push({ id: Date.now().toString(), date: selectedDate, title, person: selectedPerson, time: document.getElementById('eventTime').value || null });
          renderCalendar();
          renderEventList();
        }
        closeAddModal();
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = '저장';
      }
    }

    async function deleteEvent(id) {
      try {
        if (isConfigured) {
          await deleteDoc(doc(db, 'events', id));
        } else {
          allEvents = allEvents.filter(e => e.id !== id);
          renderCalendar();
          renderEventList();
        }
      } catch (err) {
        console.error(err);
      }
    }

    // ===== EVENT LISTENERS =====
    document.getElementById('prevMonthBtn').addEventListener('click', () => {
      currentMonth--;
      if (currentMonth < 0) { currentMonth = 11; currentYear--; }
      renderCalendar();
    });
    document.getElementById('nextMonthBtn').addEventListener('click', () => {
      currentMonth++;
      if (currentMonth > 11) { currentMonth = 0; currentYear++; }
      renderCalendar();
    });
    document.getElementById('addEventBtn').addEventListener('click', openAddForm);
    document.getElementById('closeDayBtn').addEventListener('click', closeDayModal);
    document.getElementById('cancelAddBtn').addEventListener('click', closeAddModal);
    document.getElementById('saveEventBtn').addEventListener('click', saveEvent);
    document.getElementById('dasolBtn').addEventListener('click', () => setSelectedPerson('dasol'));
    document.getElementById('donggeunBtn').addEventListener('click', () => setSelectedPerson('donggeun'));
    document.getElementById('coupleBtn').addEventListener('click', () => setSelectedPerson('couple'));

    document.getElementById('dayModal').addEventListener('click', function(e) {
      if (e.target === this) closeDayModal();
    });
    document.getElementById('addModal').addEventListener('click', function(e) {
      if (e.target === this) closeAddModal();
    });

    document.getElementById('eventTitle').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') saveEvent();
    });

    // ===== INIT =====
    updateDday();
    renderAnniversaries();
    renderCalendar();
  </script>
</body>
</html>
