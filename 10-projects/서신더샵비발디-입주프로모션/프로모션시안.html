<title>서신더샵비발디 입주 특별 프로모션 | 일룸 중화산점</title>

<style>
  @page { size: A4; margin: 0; }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream: #F5F1EB;
    --white: #ffffff;
    --red: #c80a1e;
    --dark: #1a1a1a;
    --body: #555;
    --muted: #999;
    --border: #E0D8CE;
    --card: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --cream: #1e1b16; --white: #262118; --red: #e8253a; --dark: #f0ece4;
      --body: #c4bcb0; --muted: #88847c; --border: #38332c; --card: #26211a;
    }
  }
  :root[data-theme="light"] {
    --cream: #F5F1EB; --white: #ffffff; --red: #c80a1e; --dark: #1a1a1a;
    --body: #555; --muted: #999; --border: #E0D8CE; --card: #fff;
  }
  :root[data-theme="dark"] {
    --cream: #1e1b16; --white: #262118; --red: #e8253a; --dark: #f0ece4;
    --body: #c4bcb0; --muted: #88847c; --border: #38332c; --card: #26211a;
  }

  html, body {
    margin: 0; padding: 0;
    background: #b8b4ae;
    font-family: 'Malgun Gothic','Apple SD Gothic Neo','맑은 고딕',sans-serif;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    padding: 24px;
  }

  .page {
    width: 794px;
    height: 1123px;
    background: var(--cream);
    box-shadow: 0 8px 40px rgba(0,0,0,0.22);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* 스트라이프 */
  .stripes { display: flex; flex-shrink: 0; }
  .stripes span { height: 9px; flex: 1; display: block; }

  /* 헤더 */
  .header {
    padding: 14px 44px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .logo-wrap img { height: 24px; width: auto; display: block; }
  .header-store { font-size: 11.5px; color: var(--muted); letter-spacing: 0.08em; }

  /* 메인 */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 26px 64px 20px;
    text-align: center;
  }

  .eyebrow {
    font-size: 10px;
    letter-spacing: 0.24em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .apt-name {
    font-size: 18px;
    font-weight: 400;
    color: var(--body);
    letter-spacing: 0.04em;
    margin-bottom: 4px;
  }

  .promo-title {
    font-size: 36px;
    font-weight: 700;
    color: var(--dark);
    line-height: 1.2;
    text-wrap: balance;
    margin-bottom: 10px;
  }

  .date-badge {
    display: inline-block;
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.1em;
    margin-bottom: 16px;
    padding: 5px 20px;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: var(--white);
  }

  .store-divider {
    display: flex;
    align-items: center;
    gap: 16px;
    width: 100%;
    margin-bottom: 20px;
  }
  .sdl { flex: 1; height: 1px; background: var(--border); }
  .sdt {
    font-size: 15px;
    font-weight: 700;
    color: var(--dark);
    letter-spacing: 0.1em;
    white-space: nowrap;
  }

  /* 혜택 강조 */
  .callout-sub {
    font-size: 15px;
    color: var(--body);
    letter-spacing: 0.04em;
    margin-bottom: 2px;
  }

  .callout-number-row {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    line-height: 1;
    margin-bottom: 2px;
  }

  .cn-prefix {
    font-size: 26px;
    font-weight: 700;
    color: var(--red);
    padding-bottom: 14px;
    margin-right: 4px;
  }

  .cn-num {
    font-size: 100px;
    font-weight: 700;
    color: var(--red);
    letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums;
  }

  .cn-unit {
    font-size: 32px;
    font-weight: 400;
    color: var(--red);
    padding-bottom: 13px;
    margin-left: 2px;
  }

  .callout-tag {
    font-size: 20px;
    font-weight: 600;
    color: var(--dark);
    margin-bottom: 20px;
  }

  /* 혜택 테이블 */
  .section-wrap { width: 100%; margin-bottom: 16px; }

  .section-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.16em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 7px;
    text-align: left;
  }

  .bt {
    width: 100%;
    border-radius: 6px;
    overflow: hidden;
    border: 1px solid var(--border);
  }

  .bt-head {
    display: grid;
    grid-template-columns: 1.2fr 2fr 1.5fr;
    background: var(--dark);
    color: white;
    padding: 12px 24px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
  }
  .bt-head span:last-child { text-align: right; }
  .bt-head span:nth-child(2) { text-align: center; }

  .bt-row {
    display: grid;
    grid-template-columns: 1.2fr 2fr 1.5fr;
    padding: 15px 24px;
    background: var(--card);
    border-top: 1px solid var(--border);
    align-items: center;
  }

  .tier-pill {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 13px;
    border-radius: 14px;
    color: white;
    display: inline-block;
    letter-spacing: 0.04em;
  }
  .t1-pill { background: var(--red); }
  .t2-pill { background: #2a2a2a; }

  .bt-cond {
    font-size: 15px;
    font-weight: 600;
    color: var(--dark);
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .bt-cond small { font-size: 11px; color: var(--muted); font-weight: 400; display: block; margin-top: 2px; }

  .bt-benefit {
    font-size: 26px;
    font-weight: 700;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .bt-benefit.t1 { color: var(--red); }
  .bt-benefit.t2 { color: #2a2a2a; }
  .bt-benefit small { font-size: 14px; font-weight: 400; }

  /* 지정세트 가로 리스트 */
  .sets-list {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    background: var(--card);
  }

  .set-row {
    display: flex;
    align-items: center;
    padding: 13px 22px;
    border-bottom: 1px solid var(--border);
  }
  .set-row:last-child { border-bottom: none; }

  .set-name {
    width: 120px;
    flex-shrink: 0;
    font-size: 13.5px;
    font-weight: 700;
    color: var(--dark);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .set-name::before {
    content: '';
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--red);
    flex-shrink: 0;
  }

  .set-divider {
    width: 1px; height: 18px;
    background: var(--border);
    margin-right: 22px;
    flex-shrink: 0;
  }

  .set-desc { font-size: 13px; color: var(--body); line-height: 1.5; }

  /* 푸터 */
  .page-footer {
    padding: 14px 44px 16px;
    display: flex;
    justify-content: center;
    align-items: center;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .page-footer img { height: 20px; width: auto; }

  @media print {
    html, body { background: white; padding: 0; margin: 0; display: block; }
    .page { box-shadow: none; width: 210mm; height: 297mm; overflow: hidden; }
  }
</style>
