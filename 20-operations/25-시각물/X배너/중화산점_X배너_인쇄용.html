  @page {
    size: 600mm 1600mm;
    margin: 0;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 600mm;
    height: 1600mm;
    overflow: hidden;
    font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  }

  .banner {
    width: 100vw;
    height: 100vh;
    background: #F7F5F1;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    overflow: hidden;
  }

  /* 상단 로고 — 30px / 880px = 3.41vh padding, 30px logo */
  .zone-brand {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3.41vh 0 3.18vh;
    flex-shrink: 0;
  }
  .zone-brand img { height: 3.41vh; width: auto; }

  /* 메인 카피 — 46px / 330px = 13.94vw */
  .zone-copy {
    padding: 0 8.48vw;
    text-align: center;
    flex-shrink: 0;
  }
  .copy-line {
    font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    font-size: 13.94vw;
    font-weight: 600;
    color: #1A1A1A;
    line-height: 1.25;
    display: block;
    letter-spacing: -0.015em;
  }
  .copy-line.red {
    color: #C80A1E;
    font-weight: 700;
  }

  /* 매장 정보 — margin-top 24px / 880px = 2.73vh */
  .zone-store {
    flex-shrink: 0;
    padding: 0 8.48vw;
    text-align: center;
    margin-top: 2.73vh;
  }
  .zone-store::before,
  .zone-store::after {
    content: '';
    display: block;
    height: 0.11vh;
    background: #D8D3CD;
    margin: 1.59vh 0;
  }
  /* store-name 22px / 330px = 6.67vw */
  .store-name {
    font-family: 'NotoBlack', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    font-size: 6.67vw;
    font-weight: 900;
    color: #1A1A1A;
    letter-spacing: 0.03em;
  }
  /* store-phone 15px / 330px = 4.55vw */
  .store-phone {
    font-size: 4.55vw;
    color: #666;
    margin-top: 0.57vh;
    letter-spacing: 0.08em;
  }

  /* 이미지: flex:1 그대로 */
  .zone-image {
    flex: 1 1 0;
    overflow: hidden;
    min-height: 0;
  }
  .zone-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 25%;
    display: block;
  }

  /* 하단 스트립 — padding 14vh top / 880 = 1.59vh */
  .zone-footer {
    flex-shrink: 0;
    background: #EDEAE4;
    border-top: 0.56vh solid #C80A1E;
    padding: 1.59vh 8.48vw 2.05vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.14vh;
  }
  /* footer-sub 12px / 330px = 3.64vw */
  .footer-sub {
    font-size: 3.64vw;
    color: #666;
    text-align: center;
    line-height: 1.9;
    letter-spacing: 0.02em;
  }
  .footer-rule {
    width: 100%;
    border: none;
    border-top: 0.11vh solid #CCC8C2;
  }
  /* footer logo 22px / 880px = 2.5vh */
  .zone-footer img { height: 2.5vh; width: auto; opacity: 0.8; }
</style>
</head>
